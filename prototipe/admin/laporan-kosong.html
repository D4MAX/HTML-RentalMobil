<section class="kartu kosong"><div class="ikon" aria-hidden="true">📊</div><h2>Tidak ada data</h2><p class="abu">Tidak ada data pada periode ini. Pilih periode lain.</p><a class="btn" href="laporan.html">Kembali ke 7 hari terakhir</a></section>
